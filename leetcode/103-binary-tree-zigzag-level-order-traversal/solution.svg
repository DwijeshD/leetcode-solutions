<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560">
  <!-- Background -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/>
  
  <!-- Tree nodes -->
  <g font-family="monospace" font-size="14" fill="#e9f4ec" stroke="#24382c">
    <!-- Node 3 -->
    <rect x="260" y="50" width="40" height="20" fill="#1a2820"/>
    <text x="280" y="65" text-anchor="middle">3</text>
    <!-- Node 9 -->
    <rect x="180" y="110" width="40" height="20" fill="#1a2820"/>
    <text x="200" y="125" text-anchor="middle">9</text>
    <!-- Node 20 -->
    <rect x="340" y="110" width="40" height="20" fill="#1a2820"/>
    <text x="360" y="125" text-anchor="middle">20</text>
    <!-- Node 15 -->
    <rect x="300" y="170" width="40" height="20" fill="#1a2820"/>
    <text x="320" y="185" text-anchor="middle">15</text>
    <!-- Node 7 -->
    <rect x="380" y="170" width="40" height="20" fill="#1a2820"/>
    <text x="400" y="185" text-anchor="middle">7</text>
  </g>
  
  <!-- Edges -->
  <g stroke="#24382c" fill="none">
    <line x1="280" y1="70" x2="200" y2="110"/>
    <line x1="280" y1="70" x2="360" y2="110"/>
    <line x1="360" y1="130" x2="320" y2="170"/>
    <line x1="360" y1="130" x2="400" y2="170"/>
  </g>
  
  <!-- Moving pointer (triangle) -->
  <g>
    <polygon points="-5,-5 5,-5 0,5" fill="#f5b942">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="discrete" values="280 40;200 100;360 100;320 160;400 160;0 0" keyTimes="0;0.125;0.25;0.375;0.5;0.625;1"/>
    </polygon>
  </g>
  
  <!-- Level 0 result -->
  <g opacity="0">
    <text x="50" y="260" fill="#e9f4ec" font-family="monospace" font-size="14">[3]</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.25"/>
  </g>
  
  <!-- Level 1 result (zigzag reversed) -->
  <g opacity="0">
    <text x="150" y="260" fill="#e9f4ec" font-family="monospace" font-size="14">[20,9]</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.25;0.375;0.5"/>
  </g>
  
  <!-- Level 2 result -->
  <g opacity="0">
    <text x="300" y="260" fill="#e9f4ec" font-family="monospace" font-size="14">[15,7]</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.5;0.625;0.75"/>
  </g>
  
  <!-- Final aggregated result -->
  <g opacity="0">
    <text x="50" y="285" fill="#63d488" font-family="monospace" font-size="14">Result: [[3],[20,9],[15,7]]</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.75;0.875;1"/>
  </g>
</svg>