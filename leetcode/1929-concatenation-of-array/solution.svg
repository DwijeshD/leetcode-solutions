<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560">
  <!-- Background -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/>

  <defs>
    <!-- Arrowhead marker for pointer -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,5 0,10" fill="#f5b942"/>
    </marker>
  </defs>

  <!-- Parameters -->
  <g id="params" visibility="hidden">
    <rect width="0" height="0"/>
  </g>

  <!-- Layout constants -->
  <g id="layout" visibility="hidden">
    <!-- just a placeholder for constants -->
    <rect width="0" height="0"/>
  </g>

  <!-- ==== Step 1: Show original array ==== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.25" values="0;1;0"/>
    <!-- Top row: original nums = [1,2,1] -->
    <!-- Box 0 -->
    <g transform="translate(100,80)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>
    <!-- Box 1 -->
    <g transform="translate(150,80)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">2</text>
    </g>
    <!-- Box 2 -->
    <g transform="translate(200,80)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>

    <!-- Bottom row: empty ans (just outlines) -->
    <!-- Six empty boxes -->
    <g transform="translate(100,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>
    <g transform="translate(150,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>
    <g transform="translate(200,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>
    <g transform="translate(250,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>
    <g transform="translate(300,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>
    <g transform="translate(350,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
    </g>

    <!-- Caption -->
    <text x="280" y="60" font-family="monospace" font-size="14" fill="#a3b8ab" text-anchor="middle">
      Original array
    </text>
  </g>

  <!-- ==== Step 2: Copy first half ==== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.25;0.375;0.5" values="0;1;0"/>
    <!-- Pointer moving over first three elements -->
    <g id="ptr1" transform="translate(100,60)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f5b942" stroke-width="2"/>
      <polygon points="-5,0 5,0 0,-10" fill="#f5b942"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="discrete" values="           100,60;           150,60;           200,60;           100,60;           150,60;           200,60;           100,60;           150,60;           200,60"/>
    </g>

    <!-- Bottom first three boxes now contain copied values -->
    <g transform="translate(100,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>
    <g transform="translate(150,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">2</text>
    </g>
    <g transform="translate(200,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>

    <!-- Caption -->
    <text x="280" y="260" font-family="monospace" font-size="14" fill="#a3b8ab" text-anchor="middle">
      Copy first half
    </text>
  </g>

  <!-- ==== Step 3: Copy second half ==== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.5;0.625;0.75" values="0;1;0"/>
    <!-- Same pointer (already defined) will be visible -->
    <g id="ptr2" transform="translate(100,60)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f5b942" stroke-width="2"/>
      <polygon points="-5,0 5,0 0,-10" fill="#f5b942"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="discrete" values="           100,60;           150,60;           200,60;           100,60;           150,60;           200,60;           100,60;           150,60;           200,60"/>
    </g>

    <!-- Bottom second three boxes now contain copied values -->
    <g transform="translate(250,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>
    <g transform="translate(300,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">2</text>
    </g>
    <g transform="translate(350,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#3fae5e"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#e9f4ec" text-anchor="middle">1</text>
    </g>

    <!-- Caption -->
    <text x="280" y="260" font-family="monospace" font-size="14" fill="#a3b8ab" text-anchor="middle">
      Copy second half
    </text>
  </g>

  <!-- ==== Step 4: Final result ==== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.75;0.875;1" values="0;1;0"/>
    <!-- Bottom row all six boxes with final values, emphasized green -->
    <g transform="translate(100,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">1</text>
    </g>
    <g transform="translate(150,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">2</text>
    </g>
    <g transform="translate(200,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">1</text>
    </g>
    <g transform="translate(250,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">1</text>
    </g>
    <g transform="translate(300,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">2</text>
    </g>
    <g transform="translate(350,180)">
      <rect width="40" height="40" fill="#1a2820" stroke="#24382c"/>
      <text x="20" y="25" font-family="monospace" font-size="16" fill="#63d488" text-anchor="middle">1</text>
    </g>

    <!-- Caption -->
    <text x="280" y="260" font-family="monospace" font-size="14" fill="#a3b8ab" text-anchor="middle">
      Final concatenated array
    </text>
  </g>
</svg>