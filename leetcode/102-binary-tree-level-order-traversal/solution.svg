<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300">
  <!-- Background -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e9f4ec"/>
    </marker>
  </defs>
  
  <!-- Tree Nodes -->
  <g font-family="monospace" font-size="14" fill="#e9f4ec" stroke="#24382c">
    <!-- Root -->
    <circle cx="280" cy="50" r="20" fill="#1a2820"/>
    <text x="280" y="55" text-anchor="middle">3</text>
    <!-- Left child -->
    <circle cx="180" cy="120" r="20" fill="#1a2820"/>
    <text x="180" y="125" text-anchor="middle">9</text>
    <!-- Right child -->
    <circle cx="380" cy="120" r="20" fill="#1a2820"/>
    <text x="380" y="125" text-anchor="middle">20</text>
    <!-- Left grandchild -->
    <circle cx="320" cy="190" r="20" fill="#1a2820"/>
    <text x="320" y="195" text-anchor="middle">15</text>
    <!-- Right grandchild -->
    <circle cx="440" cy="190" r="20" fill="#1a2820"/>
    <text x="440" y="195" text-anchor="middle">7</text>
    
    <!-- Edges -->
    <path d="M280,50 Q230,85 180,120" fill="none" stroke="#e9f4ec" marker-end="url(#arrow)"/>
    <path d="M280,50 Q430,85 380,120" fill="none" stroke="#e9f4ec" marker-end="url(#arrow)"/>
    <path d="M380,120 Q380,155 320,190" fill="none" stroke="#e9f4ec" marker-end="url(#arrow)"/>
    <path d="M380,120 Q460,155 440,190" fill="none" stroke="#e9f4ec" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Moving pointer (triangle) -->
  <g fill="#f5b942" stroke="#f5b942">
    <path d="M0,-10 L-8,0 L8,0 Z"/>
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0 0;-100 70;100 70;0 0" keyTimes="0;0.33;0.66;1"/>
  </g>
  
  <!-- Step 0: initial queue after enqueuing root -->
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0;0.33;1" values="0;1;0;0"/>
    <text x="100" y="260" fill="#a3b8ab">Queue:</text>
    <rect x="150" y="245" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="170" y="267" fill="#e9f4ec" text-anchor="middle">3</text>
    <text x="280" y="260" fill="#a3b8ab">Result so far:</text>
    <text x="380" y="260" fill="#63d488">[[3]]</text>
  </g>
  
  <!-- Step 1: after processing root, children enqueued -->
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1" values="0;1;0;0"/>
    <text x="80" y="260" fill="#a3b8ab">Queue:</text>
    <rect x="150" y="245" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="170" y="267" fill="#e9f4ec" text-anchor="middle">9</text>
    <rect x="210" y="245" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="230" y="267" fill="#e9f4ec" text-anchor="middle">20</text>
    <text x="280" y="260" fill="#a3b8ab">Result so far:</text>
    <text x="380" y="260" fill="#63d488">[[3],[9,20]]</text>
  </g>
  
  <!-- Step 2: final queue empty, full result -->
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.66;0.99;1" values="0;1;0;0"/>
    <text x="80" y="260" fill="#a3b8ab">Queue:</text>
    <text x="150" y="267" fill="#a3b8ab">empty</text>
    <text x="260" y="260" fill="#a3b8ab">Result:</text>
    <text x="340" y="260" fill="#63d488">[[3],[9,20],[15,7]]</text>
  </g>
</svg>