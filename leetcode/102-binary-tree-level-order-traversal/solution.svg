<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560">
  <!-- Background -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0 0 L0 6 L6 3 Z" fill="#f5b942"/>
    </marker>
  </defs>
  
  <!-- Static Tree Diagram -->
  <g>
    <!-- Edges -->
    <path d="M280 55 L180 105" stroke="#f5b942" fill="none" marker-end="url(#arrow)"/>
    <path d="M300 55 L380 105" stroke="#f5b942" fill="none" marker-end="url(#arrow)"/>
    <path d="M380 135 C360 150 340 170 330 185" stroke="#f5b942" fill="none" marker-end="url(#arrow)"/>
    <path d="M400 135 C420 150 440 170 430 185" stroke="#f5b942" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Nodes -->
    <!-- Root -->
    <rect x="260" y="25" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="280" y="45" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">3</text>
    <!-- Left child -->
    <rect x="160" y="105" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="180" y="125" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">9</text>
    <!-- Right child -->
    <rect x="360" y="105" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="380" y="125" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">20</text>
    <!-- 15 -->
    <rect x="310" y="175" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="330" y="195" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">15</text>
    <!-- 7 -->
    <rect x="410" y="175" width="40" height="30" fill="#1a2820" stroke="#24382c"/>
    <text x="430" y="195" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">7</text>
  </g>
  
  <!-- Step 0: Initial queue -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0;0.1667" dur="8s" repeatCount="indefinite"/>
    <!-- Caption -->
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Start: queue contains root</text>
    <!-- Queue -->
    <rect x="240" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="260" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">3</text>
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#e9f4ec">Result: []</text>
  </g>
  
  <!-- Step 1: Process 3, enqueue 9 & 20 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.3333" dur="8s" repeatCount="indefinite"/>
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Process 3, enqueue 9 and 20</text>
    <!-- Queue -->
    <rect x="190" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="210" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">9</text>
    <rect x="240" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="260" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">20</text>
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#e9f4ec">Result: [[3]]</text>
  </g>
  
  <!-- Step 2: Process 9 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.5" dur="8s" repeatCount="indefinite"/>
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Process 9 (no children)</text>
    <!-- Queue -->
    <rect x="190" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="210" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">20</text>
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#e9f4ec">Result: [[3],[9]]</text>
  </g>
  
  <!-- Step 3: Process 20, enqueue 15 & 7 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6667" dur="8s" repeatCount="indefinite"/>
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Process 20, enqueue 15 and 7</text>
    <!-- Queue -->
    <rect x="190" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="210" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">15</text>
    <rect x="240" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="260" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">7</text>
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#e9f4ec">Result: [[3],[9,20]]</text>
  </g>
  
  <!-- Step 4: Process 15 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;0.8333" dur="8s" repeatCount="indefinite"/>
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Process 15 (no children)</text>
    <!-- Queue -->
    <rect x="190" y="245" width="40" height="30" fill="#1a2820" stroke="#3fae5e"/>
    <text x="210" y="265" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#e9f4ec">7</text>
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#e9f4ec">Result: [[3],[9,20],[15]]</text>
  </g>
  
  <!-- Step 5: Process 7 – finished -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8333;1" dur="8s" repeatCount="indefinite"/>
    <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#f5b942">Process 7 (no children) – finished</text>
    <!-- Queue: empty (no rects) -->
    <!-- Result -->
    <text x="50" y="30" font-family="monospace" font-size="12" fill="#63d488">Result: [[3],[9,20],[15,7]]</text>
  </g>
</svg>