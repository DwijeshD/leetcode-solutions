<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560">
  <!-- background -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/>
  
  <!-- definitions for pointer marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,0 5,10" fill="#f5b942"/>
    </marker>
  </defs>
  
  <!-- characters -->
  <g font-family="monospace" font-size="16" fill="#e9f4ec">
    <!-- boxes + letters -->
    <g id="c0">
      <rect x="50" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="70" y="127" text-anchor="middle">a</text>
    </g>
    <g id="c1">
      <rect x="95" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="115" y="127" text-anchor="middle">b</text>
    </g>
    <g id="c2">
      <rect x="140" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="160" y="127" text-anchor="middle">c</text>
    </g>
    <g id="c3">
      <rect x="185" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="205" y="127" text-anchor="middle">a</text>
    </g>
    <g id="c4">
      <rect x="230" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="250" y="127" text-anchor="middle">b</text>
    </g>
    <g id="c5">
      <rect x="275" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="295" y="127" text-anchor="middle">c</text>
    </g>
    <g id="c6">
      <rect x="320" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="340" y="127" text-anchor="middle">b</text>
    </g>
    <g id="c7">
      <rect x="365" y="100" width="40" height="40" rx="5" fill="#1a2820" stroke="#24382c"/>
      <text x="385" y="127" text-anchor="middle">b</text>
    </g>
  </g>
  
  <!-- sliding window highlight -->
  <rect id="window" y="95" height="50" fill="#3fae5e" opacity="0.3">
    <animate attributeName="x" values="50;50;50;95;140;185;275;365" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
    <animate attributeName="width" values="40;85;130;130;130;130;85;40" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  
  <!-- left pointer -->
  <g id="leftPtr" fill="#f5b942" opacity="0.9">
    <polygon points="0,0 10,0 5,10"/>
    <animateTransform attributeName="transform" type="translate" values="70,90;70,90;70,90;115,90;160,90;205,90;295,90;340,90" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </g>
  
  <!-- right pointer -->
  <g id="rightPtr" fill="#f5b942" opacity="0.9">
    <polygon points="0,0 10,0 5,10"/>
    <animateTransform attributeName="transform" type="translate" values="70,90;115,90;160,90;205,90;250,90;295,90;340,90;385,90" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" dur="8s" repeatCount="indefinite" calcMode="discrete"/>
  </g>
  
  <!-- step captions -->
  <g font-family="monospace" font-size="14" fill="#a3b8ab">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0;0.125" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=0, char='a', window=[0], best=1</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.125;0.25" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=1, char='b', window=[0,1], best=2</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.375" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=2, char='c', window=[0,2], best=3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.375;0.5" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=3, char='a' duplicate, left→1, window=[1,3], best=3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.625" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=4, char='b' duplicate, left→2, window=[2,4], best=3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.625;0.75" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=5, char='c' duplicate, left→3, window=[3,5], best=3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.875" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=6, char='b' duplicate, left→5, window=[5,6], best=3</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.875;1" dur="8s" repeatCount="indefinite"/>
      <text x="20" y="250">right=7, char='b' duplicate, left→7, window=[7,7], best=3</text>
    </g>
  </g>
  
  <!-- final result -->
  <text x="400" y="200" font-family="monospace" font-size="24" fill="#63d488">Result = 3</text>
</svg>