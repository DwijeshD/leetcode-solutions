<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560">
  <title>Longest Palindromic Substring — Expand Around Center</title>
  <desc>N=5; windows 0-0.2,0.2-0.4,0.4-0.6,0.6-0.8,0.8-1; primary=array row 5 cells pitch 56; aux=state panel; moving=L and R pointers + window rect; verdict=return "bab"</desc>
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c" stroke-width="2"/>

  <!-- BAND 1: header -->
  <text x="24" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#e9f4ec">Longest Palindrome — Expand Center</text>
  <text x="536" y="26" text-anchor="end" font-family="monospace" font-size="10" fill="#a3b8ab">O(n²) time · O(1) space</text>
  <line x1="20" y1="36" x2="540" y2="36" stroke="#24382c" stroke-width="1"/>

  <!-- BAND 2 left column: string cells, pitch 56 -->
  <text x="24" y="60" font-family="monospace" font-size="10" fill="#a3b8ab">s = "babad"</text>
  <text x="48" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3b8ab">0</text>
  <text x="104" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3b8ab">1</text>
  <text x="160" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3b8ab">2</text>
  <text x="216" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3b8ab">3</text>
  <text x="272" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#a3b8ab">4</text>

  <rect x="24" y="106" width="48" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <rect x="80" y="106" width="48" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <rect x="136" y="106" width="48" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <rect x="192" y="106" width="48" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <rect x="248" y="106" width="48" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>

  <text x="48" y="132" text-anchor="middle" font-family="monospace" font-size="15" fill="#e9f4ec">b</text>
  <text x="104" y="132" text-anchor="middle" font-family="monospace" font-size="15" fill="#e9f4ec">a</text>
  <text x="160" y="132" text-anchor="middle" font-family="monospace" font-size="15" fill="#e9f4ec">b</text>
  <text x="216" y="132" text-anchor="middle" font-family="monospace" font-size="15" fill="#e9f4ec">a</text>
  <text x="272" y="132" text-anchor="middle" font-family="monospace" font-size="15" fill="#e9f4ec">d</text>

  <!-- Palindromic window outline -->
  <rect y="106" height="40" rx="6" fill="none" stroke-width="2">
    <animate attributeName="x" calcMode="discrete" values="80;24;80;80;24" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="width" calcMode="discrete" values="48;160;104;160;160" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke" calcMode="discrete" values="#3fae5e;#3fae5e;#f5b942;#3fae5e;#63d488" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Pointer L: strictly ABOVE row, pointing down -->
  <g>
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="56,0;0,0;56,0;56,0;0,0" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <polygon points="48,104 42,94 54,94" fill="#f5b942"/>
    <text x="48" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5b942">L</text>
  </g>

  <!-- Pointer R: strictly BELOW row, pointing up -->
  <g>
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="56,0;112,0;112,0;168,0;112,0" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <polygon points="48,148 42,158 54,158" fill="#f5b942"/>
    <text x="48" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#f5b942">R</text>
  </g>

  <!-- BAND 2 right column: auxiliary state panel -->
  <rect x="344" y="52" width="196" height="104" rx="8" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <text x="356" y="72" font-family="monospace" font-size="10" fill="#a3b8ab">state</text>
  <line x1="356" y1="80" x2="528" y2="80" stroke="#24382c" stroke-width="1"/>
  <text x="356" y="100" font-family="monospace" font-size="10" fill="#a3b8ab">center :</text>
  <text x="356" y="124" font-family="monospace" font-size="10" fill="#a3b8ab">chars  :</text>
  <text x="356" y="148" font-family="monospace" font-size="10" fill="#a3b8ab">substr :</text>

  <!-- Panel row values per step -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/>
    <text x="420" y="100" font-family="monospace" font-size="10" fill="#e9f4ec">i=1 ('a')</text>
    <text x="420" y="124" font-family="monospace" font-size="10" fill="#63d488">s[1]=='a'</text>
    <text x="420" y="148" font-family="monospace" font-size="10" fill="#63d488">"a" (len 1)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.4" dur="10s" repeatCount="indefinite"/>
    <text x="420" y="100" font-family="monospace" font-size="10" fill="#e9f4ec">i=1 ('a')</text>
    <text x="420" y="124" font-family="monospace" font-size="10" fill="#63d488">b == b (match)</text>
    <text x="420" y="148" font-family="monospace" font-size="10" fill="#63d488">"bab" (len 3)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.6" dur="10s" repeatCount="indefinite"/>
    <text x="420" y="100" font-family="monospace" font-size="10" fill="#e9f4ec">i=1, j=2</text>
    <text x="420" y="124" font-family="monospace" font-size="10" fill="#f5b942">a != b (stop)</text>
    <text x="420" y="148" font-family="monospace" font-size="10" fill="#a3b8ab">len 0</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <text x="420" y="100" font-family="monospace" font-size="10" fill="#e9f4ec">i=2 ('b')</text>
    <text x="420" y="124" font-family="monospace" font-size="10" fill="#63d488">a == a (match)</text>
    <text x="420" y="148" font-family="monospace" font-size="10" fill="#63d488">"aba" (len 3)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="10s" repeatCount="indefinite"/>
    <text x="420" y="100" font-family="monospace" font-size="10" fill="#e9f4ec">i=0..2</text>
    <text x="420" y="124" font-family="monospace" font-size="10" fill="#63d488">verified</text>
    <text x="420" y="148" font-family="monospace" font-size="10" fill="#63d488">"bab" (best)</text>
  </g>

  <!-- Live value badge: max_len -->
  <rect x="344" y="164" width="196" height="26" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="1.5"/>
  <text x="432" y="182" text-anchor="end" font-family="monospace" font-size="12" fill="#f5b942">max_len =</text>
  <text x="440" y="182" font-family="monospace" font-size="12" fill="#63d488" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/>
    1
  </text>
  <text x="440" y="182" font-family="monospace" font-size="12" fill="#63d488" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/>
    3
  </text>

  <!-- BAND 3: captions -->
  <line x1="20" y1="196" x2="540" y2="196" stroke="#24382c" stroke-width="1"/>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="218" font-family="monospace" font-size="11" fill="#f5b942">center i=1: odd palindrome start at L=1, R=1</text>
    <text x="24" y="238" font-family="monospace" font-size="10" fill="#a3b8ab">s[1]='a' matches -&gt; palindrome "a", length 1</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.4" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="218" font-family="monospace" font-size="11" fill="#f5b942">expand outward: L=0, R=2 -&gt; s[0]=='b' and s[2]=='b'</text>
    <text x="24" y="238" font-family="monospace" font-size="10" fill="#a3b8ab">match found! substring s[0..2] = "bab", length 3 &gt; max</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.6" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="218" font-family="monospace" font-size="11" fill="#f5b942">even center between 1 and 2: L=1, R=2</text>
    <text x="24" y="238" font-family="monospace" font-size="10" fill="#a3b8ab">s[1]='a' != s[2]='b' -&gt; mismatch, cannot expand</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="218" font-family="monospace" font-size="11" fill="#f5b942">center i=2: expand L=1, R=3 -&gt; s[1]=='a' and s[3]=='a'</text>
    <text x="24" y="238" font-family="monospace" font-size="10" fill="#a3b8ab">match found: "aba", length 3 &lt;= max_len 3 (keep "bab")</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="218" font-family="monospace" font-size="11" fill="#f5b942">all centers checked -&gt; maximum length is 3</text>
    <text x="24" y="238" font-family="monospace" font-size="10" fill="#a3b8ab">longest palindromic substring is "bab"</text>
  </g>

  <!-- BAND 4: step rail + verdict badge -->
  <rect x="24" y="256" width="36" height="22" rx="5" fill="#1a2820" stroke="#24382c" stroke-width="1"/>
  <rect x="68" y="256" width="36" height="22" rx="5" fill="#1a2820" stroke="#24382c" stroke-width="1"/>
  <rect x="112" y="256" width="36" height="22" rx="5" fill="#1a2820" stroke="#24382c" stroke-width="1"/>
  <rect x="156" y="256" width="36" height="22" rx="5" fill="#1a2820" stroke="#24382c" stroke-width="1"/>
  <rect x="200" y="256" width="36" height="22" rx="5" fill="#1a2820" stroke="#24382c" stroke-width="1"/>
  <text x="42" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#a3b8ab">1</text>
  <text x="86" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#a3b8ab">2</text>
  <text x="130" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#a3b8ab">3</text>
  <text x="174" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#a3b8ab">4</text>
  <text x="218" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#a3b8ab">5</text>

  <g>
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0,0;44,0;88,0;132,0;176,0" keyTimes="0;0.2;0.4;0.6;0.8" dur="10s" repeatCount="indefinite"/>
    <rect x="24" y="256" width="36" height="22" rx="5" fill="none" stroke="#3fae5e" stroke-width="1.6"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="10s" repeatCount="indefinite"/>
    <rect x="340" y="252" width="200" height="32" rx="8" fill="#1a2820" stroke="#63d488" stroke-width="2"/>
    <text x="440" y="273" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#63d488">return "bab"</text>
  </g>
</svg>