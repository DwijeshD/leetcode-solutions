<svg viewBox="0 0 560 300" width="560" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/><text x="20" y="30" fill="#e9f4ec" font-family="monospace" font-size="15" font-weight="bold">Longest Common Prefix</text><g><rect x="196" y="110" width="52" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.3333;0.3333;0.6667;0.6667;1.0000;1" values="#24382c;#3fae5e;#3fae5e;#3fae5e;#3fae5e;#3fae5e;#3fae5e;#24382c" dur="9s" repeatCount="indefinite"/></rect><text x="222" y="135" fill="#e9f4ec" font-family="monospace" font-size="13" text-anchor="middle">"flower"</text></g><g><rect x="254" y="110" width="52" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.3333;0.3333;0.6667;0.6667;1.0000;1" values="#24382c;#24382c;#24382c;#3fae5e;#3fae5e;#3fae5e;#3fae5e;#24382c" dur="9s" repeatCount="indefinite"/></rect><text x="280" y="135" fill="#e9f4ec" font-family="monospace" font-size="13" text-anchor="middle">"flow"</text></g><g><rect x="312" y="110" width="52" height="40" rx="6" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.3333;0.3333;0.6667;0.6667;1.0000;1" values="#24382c;#24382c;#24382c;#24382c;#24382c;#3fae5e;#3fae5e;#24382c" dur="9s" repeatCount="indefinite"/></rect><text x="338" y="135" fill="#e9f4ec" font-family="monospace" font-size="13" text-anchor="middle">"flight"</text></g><g transform="translate(222,96)"><path d="M 0 0 L -6 -10 L 6 -10 Z" fill="#f5b942"/><animateTransform attributeName="transform" type="translate" calcMode="discrete" additive="replace" keyTimes="0.0000;0.3333;0.6667;1" values="222,96;222,96;222,96;222,96" dur="9s" repeatCount="indefinite"/></g><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">prefix = first string: "flower"<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.0000;0.3333;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">shrink prefix until strs[1] starts with it -&gt; "fl"<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.3333;0.6667;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">shrink again against strs[2] -&gt; "fl"<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.6667;1.0000;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="250" fill="#63d488" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" opacity="0">return "fl"<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.85;0.95;1" values="0;0;1;1" dur="9s" repeatCount="indefinite"/></text></svg>