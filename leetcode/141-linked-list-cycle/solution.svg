<svg viewBox="0 0 560 300" width="560" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="300" rx="10" fill="#0b1310" stroke="#24382c"/><text x="20" y="30" fill="#e9f4ec" font-family="monospace" font-size="15" font-weight="bold">Linked List Cycle</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#24382c"/></marker></defs><line x1="189.5" y1="110" x2="220.5" y2="110" stroke="#24382c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="167.5" cy="110" r="22" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.2500;0.2500;0.5000;0.5000;0.7500;0.7500;1.0000;1" values="#24382c;#3fae5e;#3fae5e;#24382c;#24382c;#24382c;#24382c;#24382c;#24382c;#24382c" dur="9s" repeatCount="indefinite"/></circle><text x="167.5" y="115" fill="#e9f4ec" font-family="monospace" font-size="12" text-anchor="middle">3</text><line x1="264.5" y1="110" x2="295.5" y2="110" stroke="#24382c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="242.5" cy="110" r="22" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.2500;0.2500;0.5000;0.5000;0.7500;0.7500;1.0000;1" values="#24382c;#24382c;#24382c;#3fae5e;#3fae5e;#24382c;#24382c;#3fae5e;#3fae5e;#24382c" dur="9s" repeatCount="indefinite"/></circle><text x="242.5" y="115" fill="#e9f4ec" font-family="monospace" font-size="12" text-anchor="middle">2</text><line x1="339.5" y1="110" x2="370.5" y2="110" stroke="#24382c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="317.5" cy="110" r="22" fill="#1a2820" stroke="#24382c" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.0000;0.2500;0.2500;0.5000;0.5000;0.7500;0.7500;1.0000;1" values="#24382c;#24382c;#24382c;#24382c;#24382c;#3fae5e;#3fae5e;#24382c;#24382c;#24382c" dur="9s" repeatCount="indefinite"/></circle><text x="317.5" y="115" fill="#e9f4ec" font-family="monospace" font-size="12" text-anchor="middle">0</text><circle cx="392.5" cy="110" r="22" fill="#1a2820" stroke="#24382c" stroke-width="2"></circle><text x="392.5" y="115" fill="#e9f4ec" font-family="monospace" font-size="12" text-anchor="middle">-4</text><g transform="translate(167.5,76)"><path d="M 0 0 L -6 -10 L 6 -10 Z" fill="#f5b942"/><animateTransform attributeName="transform" type="translate" calcMode="discrete" keyTimes="0.0000;0.2500;0.5000;0.7500;1" values="167.5,76;242.5,76;317.5,76;242.5,76;242.5,76" dur="9s" repeatCount="indefinite"/></g><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">slow=head, fast=head<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.0000;0.2500;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">slow moves 1 step, fast moves 2<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.2500;0.5000;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">fast may wrap via the cycle edge<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.5000;0.7500;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="200" fill="#a3b8ab" font-family="monospace" font-size="13" opacity="0">slow == fast -&gt; cycle detected<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.7500;1.0000;1" values="0;1;0;0" dur="9s" repeatCount="indefinite"/></text><text x="280" y="250" fill="#63d488" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" opacity="0">return true<animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.85;0.95;1" values="0;0;1;1" dur="9s" repeatCount="indefinite"/></text></svg>